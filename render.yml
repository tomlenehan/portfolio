# Render auto-detects render.yaml by default. This mirror is included because
# some teams use the .yml extension when selecting a custom Blueprint path.
services:
  - type: web
    runtime: static
    name: tom-lenehan-portfolio
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
